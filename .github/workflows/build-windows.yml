name: build-windows-installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: نصب پکیج‌ها
        run: npm install

      - name: ساخت نصب‌کننده ویندوز
        run: npm run build

      - name: آپلود فایل نصب‌کننده
        uses: actions/upload-artifact@v4
        with:
          name: datampoy-windows-installer
          path: dist/*.exe
